---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: valhalla-os
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into your image's root folder /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship

        # 1) Virtual Machine Manager & Dependencies
        - virt-manager
        - qemu-kvm
        - libvirt
        - edk2-ovmf # UEFI Support für VMs

        # 2) Multimedia Codecs & Nautilus Thumbnail Vorschau
        - ffmpeg
        - gstreamer1-plugin-libav
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - ffmpegthumbnailer # Thumbnailer für Videos
        - totem-video-thumbnailer
        - gdk-pixbuf2-raw-thumbnailer # Korrigierter Name für RAW-Bilder
        - gnome-epub-thumbnailer

        # 3) KDE Texteditor
        - kate

        # 4) GNOME Extensions Tools
        - gnome-extensions-app
        - gnome-browser-connector

        # 5) Container & Dev Tools (Bluefin DX & Editoren)
        - distrobox
        - just
        - podman-compose
        - podman-docker
        - neovim
        - code # Wichtig: Erfordert die vscode.repo Datei!

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install: 
          - org.gnome.Loupe
      - scope: user 

  - type: signing
