# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: valhallalinux
description: Immutable Linux distro based on Bluefin-DX, featuring COSMIC and Tuxedo Tools.

base-image: ghcr.io/ublue-os/bluefin-dx
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - darrencocco/tuxedo-control-center
        # Falls cosmic-desktop nicht in den Standard-Fedora-Repos gefunden wird:
        # - ryanabx/cosmic
    install:
      packages:
        # --- TUXEDO TOOLS ---
        - tuxedo-control-center
        - tuxedo-drivers

        # --- COSMIC DESKTOP ---
        - cosmic-desktop

        # --- TERMINAL & TOOLS ---
        - foot
        - micro
        - fish
        - git
        - brightnessctl

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - it.mijorus.gearlever

  - type: os-release
    properties:
      ID: valhallalinux
      ID_LIKE: fedora
      NAME: Valhalla Linux
      PRETTY_NAME: Valhalla Linux (Bluefin-DX Based)

  - type: signing
