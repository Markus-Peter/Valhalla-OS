# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: valhalla-os
description: This is my personal OS image with COSMIC Desktop.

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
        - ryanabx/cosmic
    install:
      packages:
        - micro
        - starship
        - fastfetch
        - cosmic-desktop

        # 1) Virtual Machine Manager & Dependencies
        - virt-manager
        - qemu-kvm
        - libvirt
        - edk2-ovmf

        # 2) Multimedia Codecs & Thumbnail Vorschau
        - ffmpeg
        - gstreamer1-plugin-libav
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - ffmpegthumbnailer

        # 3) Texteditor
        - kate

        # 4) Container & Dev Tools
        - distrobox
        - just
        - podman-compose
        - podman-docker
        - neovim

  # COSMIC Display Manager (Login-Bildschirm) aktivieren
  - type: systemd
    system:
      enabled:
        - cosmic-greeter.service

  - type: signing
