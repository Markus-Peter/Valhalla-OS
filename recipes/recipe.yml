# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: valhalla-os
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - fastfetch                # Systeminfo-CLI-Tool hinzugefügt

        # 1) Virtual Machine Manager & Dependencies
        - virt-manager
        - qemu-kvm
        - libvirt
        - edk2-ovmf

        # 2) Multimedia Codecs & Nautilus Thumbnail Vorschau
        - ffmpeg
        - gstreamer1-plugin-libav
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - ffmpegthumbnailer
        - totem-video-thumbnailer
        - gnome-epub-thumbnailer

        # 3) KDE Texteditor
        - kate

        # 4) GNOME Extensions Tools & Tweaks
        - gnome-extensions-app
        - gnome-browser-connector
        - gnome-tweaks            # GNOME Optimierungen hinzugefügt

        # 5) Container & Dev Tools
        - distrobox
        - just
        - podman-compose
        - podman-docker
        - neovim

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install: 
          - org.gnome.Loupe       
      - scope: user 

  - type: signing
