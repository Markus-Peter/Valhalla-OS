# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: valhallalinux
description: Immutable Linux distro based on Bluefin-DX, featuring COSMIC and Tuxedo Tools.

# 1) Base-Image auf Bluefin-DX geändert
base-image: ghcr.io/ublue-os/bluefin-dx
# Bluefin nutzt "latest" (entspricht dem aktuellen stabilen Fedora-Release, z.B. 40/41)
image-version: latest 

modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/ into your image's root folder.

  - type: dnf
    repos:
      # 2) COPR für das Tuxedo Control Center und die Treiber
      - copr: darrencocco/tuxedo-control-center
    install:
      packages:
        # --- TUXEDO TOOLS ---
        - tuxedo-control-center
        - tuxedo-drivers
        
        # --- COSMIC DESKTOP ---
        # Installiert die komplette neue COSMIC Desktop Umgebung inkl. Abhängigkeiten
        - cosmic-desktop
        
        # --- TERMINAL APPS ---
        # Hinweis: bluefin-dx bringt micro, fish und git bereits mit, 
        # das erneute Auflisten hier schadet aber nicht.
        - foot
        - micro
        - fish
        - fastfetch
        - git
        - brightnessctl

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished 
        scope: system
        install: 
        # we love app images
          - it.mijorus.gearlever
      - scope: user 

  - type: os-release
    properties:
      ID: valhallalinux
      ID_Like: fedora
      NAME: Valhalla Linux
      PRETTY_NAME: Valhalla Linux (Bluefin-DX Based)

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
